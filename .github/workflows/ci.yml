name: CI Validasi SATU DPBI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: TypeScript Lint, Unit Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Run domain & route unit tests
        run: npm test

      - name: Build frontend & server bundle
        run: npm run build
